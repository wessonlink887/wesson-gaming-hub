
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wesson's Gaming Hub</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#090707;
 color:white;font-family:Arial,sans-serif;text-align:center
}
header{
 padding:25px 10px;border-radius:18px;
 background:linear-gradient(135deg,#500b16,#130608);
 border:1px solid #ff263d
}
h1 span{color:#ff263d}
input{
 width:100%;padding:15px;margin:20px 0;
 background:#1b1012;color:white;
 border:1px solid #ff263d;border-radius:12px;
 font-size:16px
}
h2{color:#ff5264}
.grid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
.app{
 display:block;padding:20px 10px;
 background:#1b1012;color:white;
 border:1px solid #69202b;border-radius:15px;
 text-decoration:none;font-weight:bold
}
.app:hover{background:#4a101b}
.emoji{display:block;font-size:35px;margin-bottom:10px}
button{
 padding:10px 15px;background:#b31529;
 color:white;border:0;border-radius:10px;
 margin:5px;font-size:14px
}
footer{margin-top:25px;color:#aaa;font-size:12px}
</style>
</head>
<body>

<header>
<p>🔴 WESSON'S GAMING HUB 🔴</p>
<h1>Wesson's <span>Gaming Portal</span></h1>
<p>Games • Videos • Entertainment</p>
</header>

<input id="search" placeholder="🔎 Search games and apps">

<h2>⭐ Your Gaming Apps</h2>

<div class="grid" id="apps">
<a class="app" href="https://roblox.com"><span class="emoji">🧱</span>Roblox</a>
<a class="app" href="https://fortnite.com"><span class="emoji">🎯</span>Fortnite</a>
<a class="app" href="https://rocketleague.com"><span class="emoji">🚗</span>Rocket League</a>
<a class="app" href="https://youtube.com"><span class="emoji">▶️</span>YouTube</a>
<a class="app" href="https://discord.com"><span class="emoji">💬</span>Discord</a>
<a class="app" href="https://minecraft.net"><span class="emoji">⛏️</span>Minecraft</a>
<a class="app" href="https://twitch.tv"><span class="emoji">🟣</span>Twitch</a>
<a class="app" href="https://chess.com"><span class="emoji">♟️</span>Chess</a>
<a class="app" href="https://coolmathgames.com"><span class="emoji">🧠</span>Coolmath Games</a>
<a class="app" href="https://spotify.com"><span class="emoji">🎵</span>Spotify</a>
</div>

<h2>⭐ Favorites</h2>
<div id="favorites">
<button onclick="alert('Tap a game above to open it!')">Add favorites by choosing your games</button>
</div>

<footer>
Wesson's Gaming Hub 🔴<br>
Official app links. Network restrictions still apply.
</footer>

<script>
const search=document.getElementById("search");
search.addEventListener("input",()=>{
 let q=search.value.toLowerCase();
 document.querySelectorAll(".app").forEach(app=>{
 app.style.display=app.innerText.toLowerCase().includes(q)?"block":"none";
 });
});
</script>
</body>
</html>
